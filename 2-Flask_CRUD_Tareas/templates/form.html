<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TO DO LIST</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

     <!-- Funciona para pestañas emergentes -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


    <style>
      body {
        display: flex;
        justify-content: center;
      }

      form {
        display: flex;
        align-items: center;
        text-align: center;
      }

      table {
        border-collapse: collapse;
      }

      table td,
      table th {
        border: 1px solid #ddd;
        padding: 8px;
      }


      table tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      table tr:hover {
        background-color: #ddd;
      }

      table th {
        padding-top: 12px;
        padding-bottom: 12px;
        text-align: left;
        background-color: #04aa6d;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>TO DO LIST</h1>
      <form method="post">
        <input type="text" name="task_name" placeholder="Title..." />
        <input
          type="text"
          name="task_description"
          placeholder="Description..."
          required
        />
        <button type="submit">Add</button>
      </form>

      <table>
        <tr>
          <th>Nombre Tarea</th>
          <th>Descripción Tarea</th>
          <th>Acciones</th>
        </tr>
        <!-- Se situa fuera de las etiquetas -->
        {% for task in tasks %}
        <tr>
          <td>{{ task['name'] }}</td>
          <td>{{ task['description'] }}</td>
          <!-- Iconos de la libreria Fontawesome -->
          <td>
            <a href="#" class="update-task"><i class="fas fa-edit"></i></a>
            <!-- Se añade  la clase delete-task para que funcione el sweetalert2 porque se ha declarado de tal manera en el Javascript -->
            <a href="#" class="delete-task"><i class="fas fa-trash-alt"></i></a>
          </td>
        </tr>
        {% endfor %}
      </table>

      <script>
        document.querySelectorAll('.delete-task').forEach(function (deleteButton) {
        deleteButton.addEventListener('click', function (event) {
          event.preventDefault(); 
          Swal.fire({
            title: '¿Estás seguro?',
            text: 'No podrás revertir esta acción.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Sí, eliminar!',
            cancelButtonText: 'Cancelar'
          }).then((result) => {
            if (result.isConfirmed) {
              Swal.fire('Eliminado!', 'Tu tarea ha sido eliminada.', 'success');
            }
          });
        });
      });
       
      document.querySelectorAll('.update-task').forEach(function (updateButton) {
          updateButton.addEventListener('click', function (event) {
            event.preventDefault(); 
            Swal.fire({
              title: '¿Estás seguro?',
              text: '¿Quieres editar esta tarea?',
              icon: 'info',
              showCancelButton: true,
              confirmButtonText: 'Sí, editar!',
              cancelButtonText: 'Cancelar'
            }).then((result) => {
              if (result.isConfirmed) {
              }
            });
          });
        });
      </script>
    </div>
  </body>
</html>
